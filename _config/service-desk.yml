---
Name: service-desk
After: '#app-backend-routes'
---
SilverStripe\Control\Director:
  rules:
    'portal//$Action': BradTipper\AppBackend\Portal\PortalController
    'api/v1/contact': BradTipper\AppBackend\Account\ContactController
    'api/v1/feedback': BradTipper\AppBackend\Account\FeedbackController
    'api/v1/tickets//$Action/$ID': BradTipper\AppBackend\Account\TicketsController

BradTipper\AppBackend\Model\Ticket:
  extensions:
    - BradTipper\AppBackend\Sync\SyncedExtension

SilverStripe\Security\Member:
  extensions:
    - BradTipper\AppBackend\Admin\MemberSupportExtension
