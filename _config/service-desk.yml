---
Name: service-desk
After: '#restful-framework-routes'
---
SilverStripe\Control\Director:
  rules:
    'portal//$Action': BradTipper\RestfulFramework\Portal\PortalController
    'api/v1/contact': BradTipper\RestfulFramework\Account\ContactController
    'api/v1/feedback': BradTipper\RestfulFramework\Account\FeedbackController
    'api/v1/tickets//$Action/$ID': BradTipper\RestfulFramework\Account\TicketsController

BradTipper\RestfulFramework\Model\Ticket:
  extensions:
    - BradTipper\RestfulFramework\Sync\SyncedExtension

SilverStripe\Security\Member:
  extensions:
    - BradTipper\RestfulFramework\Admin\MemberSupportExtension
